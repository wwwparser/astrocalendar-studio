<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}AstroCalendar{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">AstroCalendar</a>
  <nav>
    <a href="/">Выпуски</a>
    <a href="/live">LIVE</a>
  </nav>
  <form class="out" method="post" action="/logout">
    <span class="who">{{ user }}</span>
    <button type="submit" class="link">выйти</button>
  </form>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  Расчёт: JPL DE440s и jup380s, Hipparcos, OpenNGC, MPC, COBS, IOTA, CNEOS.
  Время московское.
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
