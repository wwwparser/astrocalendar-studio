# Apache: astrocalendar.optegra.ru → контейнер на 127.0.0.1:8120
#
# HTTP отвечает только двумя вещами: отдаёт проверку Let's Encrypt и
# перенаправляет всё остальное на HTTPS. Сайт закрыт паролем, и пускать пароли
# по открытому каналу нельзя.

<VirtualHost *:80>
    ServerName astrocalendar.optegra.ru

    # Проверка домена при выпуске и продлении сертификата
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/astrocalendar-error.log
    CustomLog ${APACHE_LOG_DIR}/astrocalendar-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName astrocalendar.optegra.ru

    ProxyPreserveHost On
    # Приложение должно знать, что снаружи HTTPS: иначе сессионная кука с
    # признаком Secure не будет выставлена и вход не заработает
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        /  http://127.0.0.1:8120/
    ProxyPassReverse /  http://127.0.0.1:8120/

    # Расчёт месяца идёт в фоне, но страница задачи держит соединение
    # опросом; запас по времени лишним не будет
    ProxyTimeout 300

    # Сайт закрыт паролем и не предназначен для индексации
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    ErrorLog ${APACHE_LOG_DIR}/astrocalendar-error.log
    CustomLog ${APACHE_LOG_DIR}/astrocalendar-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/astrocalendar.optegra.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/astrocalendar.optegra.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
